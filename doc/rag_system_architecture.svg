<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1370" viewBox="0 0 2200 1370" role="img" aria-labelledby="title desc">
  <title id="title">企业级 RAG 问答系统架构图</title>
  <desc id="desc">展示 Streamlit 前端、FastAPI 接口、核心业务服务、数据与模型基础设施以及可观测性组件之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40576e"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8797a7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#203244" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill:#f7fafc; }
      .title { fill:#172b3f; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:32px; font-weight:700; }
      .subtitle { fill:#617489; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:15px; }
      .band { stroke-width:1.5; }
      .client-band { fill:#eef6ff; stroke:#b8d4ee; }
      .api-band { fill:#f1f8f4; stroke:#b9d8c1; }
      .core-band { fill:#fff8ed; stroke:#e4cca1; }
      .data-band { fill:#f5f1fb; stroke:#d2c3e7; }
      .ops-band { fill:#f3f5f7; stroke:#c8d0d8; }
      .band-title { fill:#25425e; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:20px; font-weight:700; }
      .band-note { fill:#6d8193; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:13px; }
      .node { fill:#fff; stroke-width:1.5; filter:url(#shadow); }
      .client-node { stroke:#76a6d1; }
      .api-node { stroke:#77ad8a; }
      .core-node { stroke:#d2a45c; }
      .data-node { stroke:#9d87c2; }
      .ops-node { stroke:#8b9aa8; }
      .node-title { fill:#1d354b; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:16px; font-weight:700; text-anchor:middle; }
      .node-subtitle { fill:#6b7e90; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:12px; text-anchor:middle; }
      .edge { fill:none; stroke:#40576e; stroke-width:2.2; marker-end:url(#arrow); }
      .edge-muted { fill:none; stroke:#8797a7; stroke-width:1.8; stroke-dasharray:8 7; marker-end:url(#arrow-muted); }
      .edge-label { fill:#6b7e90; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:12px; }
      .legend { fill:#617489; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:13px; }
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1370"/>
  <text class="title" x="70" y="52">企业级 RAG 问答系统架构图</text>
  <text class="subtitle" x="70" y="80">当前项目的前端、接口、核心服务、数据基础设施与企业部署观测组件</text>

  <rect class="band client-band" x="45" y="105" width="2110" height="190" rx="18"/>
  <text class="band-title" x="75" y="140">访问层：Streamlit 业务前端</text>
  <text class="band-note" x="75" y="163">用户从统一页面完成问答、知识库管理、评测和反馈处理</text>
  <rect class="node client-node" x="95" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="220" y="226">Streamlit Web</text><text class="node-subtitle" x="220" y="249">问答 / 知识库 / 系统设置</text>
  <rect class="node client-node" x="395" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="520" y="226">评测与反馈页面</text><text class="node-subtitle" x="520" y="249">RAG 评测 / 反馈处理</text>
  <rect class="node client-node" x="695" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="820" y="226">流式问答体验</text><text class="node-subtitle" x="820" y="249">SSE 进度 / 答案 / 引用</text>
  <rect class="node client-node" x="995" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="1120" y="226">销售分析页面</text><text class="node-subtitle" x="1120" y="249">Text-to-SQL / 结果表格</text>
  <rect class="node client-node" x="1295" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="1420" y="226">API 客户端</text><text class="node-subtitle" x="1420" y="249">Bearer Token / HTTP</text>
  <rect class="node client-node" x="1595" y="195" width="250" height="70" rx="12"/>
  <text class="node-title" x="1720" y="226">管理员操作台</text><text class="node-subtitle" x="1720" y="249">版本 / 发布 / 后台任务</text>
  <path class="edge" d="M1120 265 V330"/><path class="edge" d="M1720 265 V330"/>
  <text class="edge-label" x="1130" y="305">HTTP / SSE</text>

  <rect class="band api-band" x="45" y="330" width="2110" height="190" rx="18"/>
  <text class="band-title" x="75" y="365">接口层：FastAPI 服务</text>
  <text class="band-note" x="75" y="388">统一认证、租户隔离、路由分发、请求校验和健康检查</text>
  <rect class="node api-node" x="95" y="420" width="290" height="70" rx="12"/>
  <text class="node-title" x="240" y="451">FastAPI Gateway</text><text class="node-subtitle" x="240" y="474">CORS / OpenAPI / 生命周期</text>
  <rect class="node api-node" x="435" y="420" width="290" height="70" rx="12"/>
  <text class="node-title" x="580" y="451">认证与租户隔离</text><text class="node-subtitle" x="580" y="474">JWT / 角色 / 权限范围</text>
  <rect class="node api-node" x="775" y="420" width="290" height="70" rx="12"/>
  <text class="node-title" x="920" y="451">业务路由</text><text class="node-subtitle" x="920" y="474">QA / Upload / Knowledge</text>
  <rect class="node api-node" x="1115" y="420" width="290" height="70" rx="12"/>
  <text class="node-title" x="1260" y="451">管理路由</text><text class="node-subtitle" x="1260" y="474">Index / Evaluation / Feedback</text>
  <rect class="node api-node" x="1455" y="420" width="290" height="70" rx="12"/>
  <text class="node-title" x="1600" y="451">任务与检索路由</text><text class="node-subtitle" x="1600" y="474">Jobs / Retrieval / Operations</text>
  <path class="edge" d="M240 490 H435"/><path class="edge" d="M725 455 H775"/><path class="edge" d="M1065 455 H1115"/><path class="edge" d="M1405 455 H1455"/>
  <path class="edge" d="M920 490 V560"/><path class="edge" d="M1600 490 V560"/>

  <rect class="band core-band" x="45" y="555" width="2110" height="285" rx="18"/>
  <text class="band-title" x="75" y="590">核心业务层：RAG、入库、任务与业务分析</text>
  <text class="band-note" x="75" y="613">所有问答和知识生产能力在这里编排，权限和质量控制贯穿处理链路</text>
  <rect class="node core-node" x="90" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="227" y="685">RAGChain</text><text class="node-subtitle" x="227" y="708">历史改写 / 意图 / 生成</text><text class="node-subtitle" x="227" y="729">引用 / 记忆 / 交互记录</text>
  <rect class="node core-node" x="405" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="542" y="685">检索服务</text><text class="node-subtitle" x="542" y="708">权限过滤 / 混合检索</text><text class="node-subtitle" x="542" y="729">重排 / 父段落补回</text>
  <rect class="node core-node" x="720" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="857" y="685">入库与文档处理</text><text class="node-subtitle" x="857" y="708">安全校验 / 解析 / OCR</text><text class="node-subtitle" x="857" y="729">清洗 / 分块 / Embedding</text>
  <rect class="node core-node" x="1035" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="1172" y="685">任务队列与 Worker</text><text class="node-subtitle" x="1172" y="708">租约 / 重试 / 恢复</text><text class="node-subtitle" x="1172" y="729">入库 / 评测 / 建索引</text>
  <rect class="node core-node" x="1350" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="1487" y="685">版本与发布服务</text><text class="node-subtitle" x="1487" y="708">候选索引 / 质量门禁</text><text class="node-subtitle" x="1487" y="729">灰度 / 回滚 / 租户指针</text>
  <rect class="node core-node" x="1665" y="650" width="275" height="115" rx="12"/>
  <text class="node-title" x="1802" y="685">Commerce / Text-to-SQL</text><text class="node-subtitle" x="1802" y="708">表结构与指标检索</text><text class="node-subtitle" x="1802" y="729">SQL 校验 / 只读执行</text>
  <path class="edge" d="M365 707 H405"/><path class="edge" d="M680 707 H720"/><path class="edge" d="M995 707 H1035"/><path class="edge" d="M1310 707 H1350"/><path class="edge" d="M1625 707 H1665"/>
  <path class="edge-muted" d="M1172 765 V805 H857 V765"/><text class="edge-label" x="930" y="801">后台任务调用</text>

  <rect class="band data-band" x="45" y="875" width="2110" height="225" rx="18"/>
  <text class="band-title" x="75" y="910">数据与模型基础设施</text>
  <text class="band-note" x="75" y="933">本地模式支持 SQLite / Chroma / FAISS，企业模板使用 PostgreSQL / OpenSearch / MinIO</text>
  <rect class="node data-node" x="90" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="230" y="999">业务数据库</text><text class="node-subtitle" x="230" y="1023">SQLite / PostgreSQL</text>
  <rect class="node data-node" x="410" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="550" y="999">向量与全文检索</text><text class="node-subtitle" x="550" y="1023">Chroma / FAISS / OpenSearch</text>
  <rect class="node data-node" x="730" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="870" y="999">文件与备份</text><text class="node-subtitle" x="870" y="1023">upload / data / MinIO / S3</text>
  <rect class="node data-node" x="1050" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="1190" y="999">大语言模型</text><text class="node-subtitle" x="1190" y="1023">Ollama / OpenAI / SiliconFlow</text>
  <rect class="node data-node" x="1370" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="1510" y="999">Embedding 与重排</text><text class="node-subtitle" x="1510" y="1023">bge_small_zh / reranker</text>
  <rect class="node data-node" x="1690" y="965" width="280" height="85" rx="12"/>
  <text class="node-title" x="1830" y="999">OCR 服务</text><text class="node-subtitle" x="1830" y="1023">腾讯 OCR / Tesseract</text>
  <path class="edge" d="M227 765 V965"/><path class="edge" d="M542 765 V965"/><path class="edge" d="M857 765 V965"/><path class="edge" d="M1487 765 V965"/><path class="edge" d="M1802 765 V965"/>

  <rect class="band ops-band" x="45" y="1135" width="2110" height="170" rx="18"/>
  <text class="band-title" x="75" y="1170">可观测性与运维层</text>
  <text class="band-note" x="75" y="1193">请求、模型、任务和质量指标统一记录，支持告警和问题追踪</text>
  <rect class="node ops-node" x="100" y="1220" width="330" height="60" rx="12"/>
  <text class="node-title" x="265" y="1256">OpenTelemetry / Tempo</text>
  <rect class="node ops-node" x="500" y="1220" width="330" height="60" rx="12"/>
  <text class="node-title" x="665" y="1256">Prometheus / Grafana</text>
  <rect class="node ops-node" x="900" y="1220" width="330" height="60" rx="12"/>
  <text class="node-title" x="1065" y="1256">Alertmanager / 告警通知</text>
  <rect class="node ops-node" x="1300" y="1220" width="330" height="60" rx="12"/>
  <text class="node-title" x="1465" y="1256">Langfuse（可选）</text>
  <rect class="node ops-node" x="1700" y="1220" width="330" height="60" rx="12"/>
  <text class="node-title" x="1865" y="1256">健康检查 / 审计日志</text>
  <path class="edge-muted" d="M1172 765 V1220 H265"/><path class="edge-muted" d="M227 765 V1220 H665"/><path class="edge-muted" d="M1487 765 V1220 H1465"/>
  <text class="edge-label" x="80" y="1340">实线：业务调用与数据流</text><line x1="285" y1="1335" x2="340" y2="1335" class="edge"/>
  <text class="edge-label" x="430" y="1340">虚线：观测、指标与告警链路</text><line x1="700" y1="1335" x2="755" y2="1335" class="edge-muted"/>
</svg>
