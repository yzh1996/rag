<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1530" viewBox="0 0 2300 1530" role="img" aria-labelledby="title desc">
  <title id="title">企业级 RAG 业务流程与质量闭环</title>
  <desc id="desc">展示文档上传入库、索引发布、在线 RAG 问答、Text-to-SQL、反馈评测和持续优化的完整流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40576e"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b8d78"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#203244" flood-opacity="0.12"/></filter>
    <style>
      .canvas { fill:#f7fafc; }
      .title { fill:#172b3f; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:32px; font-weight:700; }
      .subtitle { fill:#617489; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:15px; }
      .band { stroke-width:1.5; }
      .offline { fill:#eef6ff; stroke:#b8d4ee; }
      .online { fill:#f1f8f4; stroke:#b9d8c1; }
      .feedback { fill:#fff8ed; stroke:#e4cca1; }
      .side { fill:#f5f1fb; stroke:#d2c3e7; }
      .band-title { fill:#25425e; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:20px; font-weight:700; }
      .band-note { fill:#6d8193; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:13px; }
      .node { fill:#fff; stroke-width:1.5; filter:url(#shadow); }
      .offline-node { stroke:#76a6d1; }
      .online-node { stroke:#77ad8a; }
      .feedback-node { stroke:#d2a45c; }
      .side-node { stroke:#9d87c2; }
      .decision { fill:#fffdf7; stroke:#c79a4d; stroke-width:1.8; filter:url(#shadow); }
      .node-title { fill:#1d354b; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:15px; font-weight:700; text-anchor:middle; }
      .node-subtitle { fill:#6b7e90; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:11px; text-anchor:middle; }
      .edge { fill:none; stroke:#40576e; stroke-width:2.2; marker-end:url(#arrow); }
      .edge-muted { fill:none; stroke:#9b8d78; stroke-width:1.8; stroke-dasharray:8 7; marker-end:url(#arrow-muted); }
      .edge-label { fill:#6b7e90; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:12px; }
      .legend { fill:#617489; font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; font-size:13px; }
    </style>
  </defs>

  <rect class="canvas" width="2300" height="1530"/>
  <text class="title" x="70" y="52">企业级 RAG 业务流程与质量闭环</text>
  <text class="subtitle" x="70" y="80">从文档进入知识库，到在线回答、数据查询、反馈评测和索引回滚</text>

  <rect class="band offline" x="45" y="105" width="2210" height="330" rx="18"/>
  <text class="band-title" x="75" y="140">离线：知识入库、索引构建与发布</text>
  <text class="band-note" x="75" y="163">上传先经过预览和权限校验，后台任务完成处理；候选索引需审核和评测后才能上线</text>
  <g>
    <rect class="node offline-node" x="80" y="220" width="190" height="80" rx="12"/><text class="node-title" x="175" y="253">文档 / 业务数据</text><text class="node-subtitle" x="175" y="277">PDF / Word / Excel / TXT</text>
    <rect class="node offline-node" x="315" y="220" width="190" height="80" rx="12"/><text class="node-title" x="410" y="253">上传与安全校验</text><text class="node-subtitle" x="410" y="277">格式 / 大小 / 权限 / 去重</text>
    <rect class="node offline-node" x="550" y="220" width="190" height="80" rx="12"/><text class="node-title" x="645" y="253">预览分块</text><text class="node-subtitle" x="645" y="277">递归 / 语义 / 父子块</text>
    <rect class="node offline-node" x="785" y="220" width="190" height="80" rx="12"/><text class="node-title" x="880" y="253">用户确认入库</text><text class="node-subtitle" x="880" y="277">提交持久化后台任务</text>
    <rect class="node offline-node" x="1020" y="220" width="190" height="80" rx="12"/><text class="node-title" x="1115" y="253">解析 / OCR / 清洗</text><text class="node-subtitle" x="1115" y="277">文本与元数据标准化</text>
    <rect class="node offline-node" x="1255" y="220" width="190" height="80" rx="12"/><text class="node-title" x="1350" y="253">Embedding 向量化</text><text class="node-subtitle" x="1350" y="277">固定模型版本</text>
    <rect class="node offline-node" x="1490" y="220" width="190" height="80" rx="12"/><text class="node-title" x="1585" y="253">构建候选索引</text><text class="node-subtitle" x="1585" y="277">版本 / 维度校验</text>
    <rect class="node offline-node" x="1725" y="220" width="190" height="80" rx="12"/><text class="node-title" x="1820" y="253">审核与评测门禁</text><text class="node-subtitle" x="1820" y="277">引用 / 权限 / Ragas</text>
    <rect class="node offline-node" x="1960" y="220" width="220" height="80" rx="12"/><text class="node-title" x="2070" y="253">发布 / 灰度 / 回滚</text><text class="node-subtitle" x="2070" y="277">租户指针切换</text>
    <path class="edge" d="M270 260 H315"/><path class="edge" d="M505 260 H550"/><path class="edge" d="M740 260 H785"/><path class="edge" d="M975 260 H1020"/><path class="edge" d="M1210 260 H1255"/><path class="edge" d="M1445 260 H1490"/><path class="edge" d="M1680 260 H1725"/><path class="edge" d="M1915 260 H1960"/>
    <path class="edge-muted" d="M645 300 V365 H880 V300"/><text class="edge-label" x="675" y="358">预览通过后确认</text>
    <path class="edge-muted" d="M2070 300 V390 H1585 V300"/><text class="edge-label" x="1760" y="385">失败保留原发布版本</text>
  </g>

  <rect class="band online" x="45" y="470" width="2210" height="435" rx="18"/>
  <text class="band-title" x="75" y="505">在线：统一问答入口与两条查询路径</text>
  <text class="band-note" x="75" y="528">先做认证和租户权限判断，再根据问题选择 RAG 知识问答或销量 Text-to-SQL</text>
  <g>
    <rect class="node online-node" x="80" y="585" width="190" height="80" rx="12"/><text class="node-title" x="175" y="618">用户提问</text><text class="node-subtitle" x="175" y="642">文本 / 多轮上下文</text>
    <rect class="node online-node" x="315" y="585" width="190" height="80" rx="12"/><text class="node-title" x="410" y="618">认证 / 租户隔离</text><text class="node-subtitle" x="410" y="642">角色 / 部门 / 权限</text>
    <rect class="node online-node" x="550" y="585" width="190" height="80" rx="12"/><text class="node-title" x="645" y="618">历史与意图识别</text><text class="node-subtitle" x="645" y="642">追问改写 / 分流</text>
    <path class="edge" d="M270 625 H315"/><path class="edge" d="M505 625 H550"/>
    <path class="edge" d="M740 625 H820"/><path class="edge" d="M740 625 V770 H820"/>
    <path class="edge-label" d=""/>
    <text class="edge-label" x="760" y="615">知识问题</text><text class="edge-label" x="760" y="755">销量问题</text>
    <rect class="node online-node" x="820" y="585" width="205" height="80" rx="12"/><text class="node-title" x="922" y="618">权限过滤检索</text><text class="node-subtitle" x="922" y="642">关键词 + 向量</text>
    <rect class="node online-node" x="1065" y="585" width="205" height="80" rx="12"/><text class="node-title" x="1167" y="618">重排与去重</text><text class="node-subtitle" x="1167" y="642">阈值 / 父段落补回</text>
    <path class="edge" d="M1025 625 H1065"/>
    <polygon class="decision" points="1390,585 1470,625 1390,665 1310,625"/><text class="node-title" x="1390" y="621">证据足够？</text>
    <path class="edge" d="M1270 625 H1310"/>
    <rect class="node online-node" x="1510" y="585" width="205" height="80" rx="12"/><text class="node-title" x="1612" y="618">受约束生成</text><text class="node-subtitle" x="1612" y="642">基于证据回答</text>
    <rect class="node online-node" x="1755" y="585" width="205" height="80" rx="12"/><text class="node-title" x="1857" y="618">引用与事实校验</text><text class="node-subtitle" x="1857" y="642">安全 / 引用状态</text>
    <rect class="node online-node" x="2000" y="585" width="210" height="80" rx="12"/><text class="node-title" x="2105" y="618">输出答案</text><text class="node-subtitle" x="2105" y="642">来源 / 置信度 / trace</text>
    <path class="edge" d="M1470 625 H1510"/><path class="edge" d="M1715 625 H1755"/><path class="edge" d="M1960 625 H2000"/>
    <path class="edge" d="M1390 665 V710 H1612 V665"/><text class="edge-label" x="1410" y="702">否：澄清 / 拒答 / 转人工</text>

    <rect class="node side-node" x="820" y="730" width="205" height="80" rx="12"/><text class="node-title" x="922" y="763">表结构与指标检索</text><text class="node-subtitle" x="922" y="787">只使用授权表</text>
    <rect class="node side-node" x="1065" y="730" width="205" height="80" rx="12"/><text class="node-title" x="1167" y="763">SQL 生成与检查</text><text class="node-subtitle" x="1167" y="787">单条 SELECT / 限行</text>
    <rect class="node side-node" x="1310" y="730" width="205" height="80" rx="12"/><text class="node-title" x="1412" y="763">只读执行</text><text class="node-subtitle" x="1412" y="787">快照一致性校验</text>
    <rect class="node side-node" x="1555" y="730" width="205" height="80" rx="12"/><text class="node-title" x="1657" y="763">销量结果</text><text class="node-subtitle" x="1657" y="787">表格 / 统计区间 / SQL</text>
    <path class="edge" d="M1025 770 H1065"/><path class="edge" d="M1270 770 H1310"/><path class="edge" d="M1515 770 H1555"/>
    <path class="edge" d="M1760 770 V850 H2105 V665"/><text class="edge-label" x="1775" y="842">结构化数据答案</text>
  </g>

  <rect class="band feedback" x="45" y="940" width="2210" height="350" rx="18"/>
  <text class="band-title" x="75" y="975">反馈、评测与持续优化</text>
  <text class="band-note" x="75" y="998">线上结果沉淀为可审计数据，经过人工处理和离线评测后驱动下一轮索引发布</text>
  <g>
    <rect class="node feedback-node" x="90" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="207" y="1094">用户反馈</text><text class="node-subtitle" x="207" y="1118">点赞 / 点踩 / 纠错 / 转人工</text>
    <rect class="node feedback-node" x="370" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="487" y="1094">问答与链路记录</text><text class="node-subtitle" x="487" y="1118">interaction_id / trace_id</text>
    <rect class="node feedback-node" x="650" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="767" y="1094">人工处理与标注</text><text class="node-subtitle" x="767" y="1118">正确答案 / 分类 / 结论</text>
    <rect class="node feedback-node" x="930" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="1047" y="1094">回归测试集</text><text class="node-subtitle" x="1047" y="1118">引用 / 拒答 / 越权 / 澄清</text>
    <rect class="node feedback-node" x="1210" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="1327" y="1094">Ragas 离线评测</text><text class="node-subtitle" x="1327" y="1118">忠实度 / 相关性 / 召回</text>
    <rect class="node feedback-node" x="1490" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="1607" y="1094">质量门禁</text><text class="node-subtitle" x="1607" y="1118">不合格版本禁止发布</text>
    <rect class="node feedback-node" x="1770" y="1060" width="235" height="85" rx="12"/><text class="node-title" x="1887" y="1094">链路调优</text><text class="node-subtitle" x="1887" y="1118">分块 / Embedding / Prompt</text>
    <rect class="node feedback-node" x="2050" y="1060" width="160" height="85" rx="12"/><text class="node-title" x="2130" y="1094">重建发布</text><text class="node-subtitle" x="2130" y="1118">灰度 / 回滚</text>
    <path class="edge" d="M325 1102 H370"/><path class="edge" d="M605 1102 H650"/><path class="edge" d="M885 1102 H930"/><path class="edge" d="M1165 1102 H1210"/><path class="edge" d="M1445 1102 H1490"/><path class="edge" d="M1725 1102 H1770"/><path class="edge" d="M2005 1102 H2050"/>
    <path class="edge-muted" d="M2105 665 V1015 H207 V1060"/><text class="edge-label" x="1940" y="1008">输出结果进入反馈</text>
    <path class="edge-muted" d="M1607 1145 V1210 H1585 V300"/><text class="edge-label" x="1618" y="1204">质量通过后构建新候选并发布</text>
  </g>

  <rect class="band side" x="45" y="1325" width="2210" height="125" rx="18"/>
  <text class="band-title" x="75" y="1360">贯穿全链路的运行控制</text>
  <text class="band-note" x="75" y="1390">后台任务：持久化队列、租约、自动重试、崩溃恢复；观测：请求延迟、首字耗时、Token、成本、错误和告警</text>
  <path class="edge-muted" d="M1172 765 V1385 H600"/><text class="legend" x="80" y="1430">实线：业务处理路径</text><line x1="245" y1="1425" x2="305" y2="1425" class="edge"/>
  <text class="legend" x="390" y="1430">虚线：反馈、评测、观测或发布控制路径</text><line x1="730" y1="1425" x2="790" y2="1425" class="edge-muted"/>
</svg>
