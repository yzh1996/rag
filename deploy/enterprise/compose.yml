name: rag-enterprise
x-app: &app
  build:
    context: ../..
    dockerfile: deploy/enterprise/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/rag
    VECTOR_STORE_TYPE: opensearch
    OPENSEARCH_URL: https://opensearch:9200
    OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
    OPENSEARCH_VERIFY_CERTS: "false"
    OPENSEARCH_DIMENSION: "512"
    AUTH_REQUIRED: "true"
    AUTH_DEV_MODE: "false"
    TASK_EXECUTION_MODE: worker
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
    QUALITY_GUARD_ENABLED: "true"
    ALLOW_GENERAL_ANSWERS: "false"
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    LANGFUSE_ENABLED: "false"
    EMBEDDING_MODEL_NAME: bge_small_zh
    RERANKER_MODEL_NAME: bge_reranker_base
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ALERT_RECEIVER_TOKEN: ${ALERT_RECEIVER_TOKEN:?Set ALERT_RECEIVER_TOKEN}
    ALERT_NOTIFICATION_URL: ${ALERT_NOTIFICATION_URL:-}
    OCR_ENABLED: ${OCR_ENABLED:-true}
    OCR_PROVIDER: ${OCR_PROVIDER:-tencent}
    OCR_DPI: ${OCR_DPI:-150}
    TENCENT_OCR_SECRET_ID: ${TENCENT_OCR_SECRET_ID:-}
    TENCENT_OCR_SECRET_KEY: ${TENCENT_OCR_SECRET_KEY:-}
    TENCENT_OCR_REGION: ${TENCENT_OCR_REGION:-ap-guangzhou}
    TENCENT_OCR_ENDPOINT: ${TENCENT_OCR_ENDPOINT:-https://ocr.tencentcloudapi.com}
    TENCENT_OCR_ACTION: ${TENCENT_OCR_ACTION:-GeneralBasicOCR}
    TENCENT_OCR_VERSION: ${TENCENT_OCR_VERSION:-2018-11-19}
    TENCENT_OCR_TIMEOUT_SECONDS: ${TENCENT_OCR_TIMEOUT_SECONDS:-15}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-}
    LLM_INPUT_COST_PER_MILLION: ${LLM_INPUT_COST_PER_MILLION:-0}
    LLM_OUTPUT_COST_PER_MILLION: ${LLM_OUTPUT_COST_PER_MILLION:-0}
  volumes:
    - uploads:/app/upload
    - app-data:/app/data
    - backups:/backups
    - ${MODELS_HOST_PATH:-../../models}:/app/models:ro
  restart: unless-stopped
services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      retries: 20
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ["search-data:/usr/share/opensearch/data"]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["object-data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    restart: unless-stopped
  backend:
    <<: *app
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/system/health')); assert r['status']=='healthy'"]
      interval: 30s
      retries: 10
  frontend:
    <<: *app
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      RAG_API_BASE: http://backend:8000/api/v1
    ports: ["127.0.0.1:8502:8501"]
    depends_on: [backend]
  worker:
    <<: *app
    command: python run_worker.py
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./otel.yml:/etc/otel/config.yml:ro"]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    user: "0"
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes: ["./tempo.yml:/etc/tempo/config.yml:ro", "trace-data:/var/tempo"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro", "metric-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./runtime/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro", "alert-data:/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
  alert-notifier:
    image: python:3.12-slim
    command: ["python", "-u", "/app/alert_dingtalk.py"]
    user: "10001:10001"
    read_only: true
    environment:
      ALERT_RECEIVER_TOKEN: ${ALERT_RECEIVER_TOKEN:?Set ALERT_RECEIVER_TOKEN}
      ALERT_DINGTALK_ENABLED: ${ALERT_DINGTALK_ENABLED:-false}
      ALERT_DINGTALK_WEBHOOK: ${ALERT_DINGTALK_WEBHOOK:-}
      ALERT_DINGTALK_SECRET: ${ALERT_DINGTALK_SECRET:-}
      ALERT_DINGTALK_TIMEOUT_SECONDS: ${ALERT_DINGTALK_TIMEOUT_SECONDS:-10}
    volumes: ["../../scripts/alert_dingtalk.py:/app/alert_dingtalk.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    volumes: ["./blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro", "dashboard-data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  maintenance:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    command: python scripts/enterprise_backup.py --help
volumes:
  postgres-data:
  search-data:
  object-data:
  uploads:
  app-data:
  backups:
  trace-data:
  metric-data:
  alert-data:
  dashboard-data:
